  '2024-10-04':
    note:
    - Worst session in months. This note will be a bit longer.
    - First off, I managed to somehow **pull a muscle while warming up** (and by warming up I mean climbing a few 'easier' routes), which is really fucking stupid and should not happen. **I need to warm up better** to prevent things like this from happening.</p><p class='climbing-note'>Second (but kind of tied to first), the warm up was **nowhere long enough** to get properly warm before trying the routes, resulting in really bad first attempts on harder routes that went completely to waste.
    - Third, the attempts on the hard routes were done **without breaks in between,** which I often do, but not to this extent -- throwing yourself at a route does not help and is, again, **fucking stupid.**
    - These three things resulted in a completely wasted session.
    - 'From now on, things will change. No warmup blues. No 5 seconds of brushing between ground attempts. I will, instead, be doing the following:'
    - <ul><li class='climbing-note'>**At least 15 minutes of warm-up** -- maybe not ideal, but a start.</li><li class='climbing-note'>**At least 3 minute break between attempts**, which is around 100x more than now.</li></ul>
    - If not, I will find you Tom. I know where you live.
    wall: Boulderhaus
