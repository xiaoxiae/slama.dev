# Flying spots for the drone journal.
# A flight refers to a spot by its key here (`drone.py add <key>`), and the page
# takes the name and map pin from this file. Paste `coords` from OpenStreetMap
# as "lat,lon"; omit it for a place that shouldn't get a map pin. An optional
# `alias` is shorthand for the key, in `drone.py add` and in a flight's `place:`
# (the script rewrites it to the key on its next run).

heidelberg-airfield:
  name: "Heidelberg Airfield"
  coords: "49.39403193368118, 8.656958854804826"

heidelberg-farm:
  name: "Heidelberg Farm / Field"
  coords: "49.36566954120332, 8.643427389580834"

vrat:
  name: "Vrát"

snehov:
  name: "Sněhov"

praha-hriste:
  name: "Praha Hřiště"

heidelberg-playground-cuzaring:
  alias: heidelberg-playground-1
  name: "Heidelberg Playground (Cuzaring)"

heidelberg-playground-kita-huttenbuhl:
  alias: heidelberg-playground-2
  name: "Heidelberg Playground (Kita Hüttenbühl)"

krimml-chateau-playground:
  name: "Playground at the Krimml Chateau"
