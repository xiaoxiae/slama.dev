baseURL = "https://slama.dev"
title = "slama.dev"
defaultContentLanguage = "en"

# Language configuration for i18n support
[languages]
  [languages.en]
    locale = "en"
    weight = 1

# Disable some default behaviors
disableKinds = ["taxonomy", "term"]

[params]
  description = "Tomáš Sláma's personal website."
  author = "Tomáš Sláma"
  halloween = true

  # Feeds the JSON-LD Person (layouts/partials/person.html). Keep in step with data/cv.yaml.
  jobTitle = "Full-stack developer"
  image = "/assets/me.webp"
  knowsAbout = [
    "Computer science",
    "Programming",
    "Algorithms",
    "Climbing",
    "Bouldering",
    "Photography",
    "Gaming",
  ]

  [params.worksFor]
    name = "MathGPT"
    url = "https://math-gpt.org/"

  [[params.alumniOf]]
    name = "Heidelberg University"
    url = "https://www.uni-heidelberg.de/en"

  [[params.alumniOf]]
    name = "Charles University"
    url = "https://www.mff.cuni.cz/en"

  [[params.alumniOf]]
    name = "Westtown School"
    url = "https://www.westtown.edu/"

  # Footer icon links. `sameAs = true` also puts the URL in Person.sameAs --
  # only for profiles that are Tomáš himself, not e.g. a playlist.
  [[params.profiles]]
    label = "YouTube"
    url = "https://www.youtube.com/channel/UC_IaBSHmisYbiYlv32EeNkQ"
    icon = "fa-brands fa-youtube"
    sameAs = true

  [[params.profiles]]
    label = "Bluesky"
    url = "https://bsky.app/profile/tomas.slama.dev"
    icon = "fa-brands fa-bluesky"
    sameAs = true

  [[params.profiles]]
    label = "GitHub"
    url = "https://github.com/xiaoxiae"
    icon = "fa-brands fa-github"
    sameAs = true

  [[params.profiles]]
    label = "Spotify playlist"
    url = "https://open.spotify.com/playlist/6tzOl4stxMsAClqNaUalBg?si=466aa28329d143fd"
    icon = "fa-brands fa-spotify"

  # Second footer group, after a wider separator.
  [[params.contacts]]
    label = "Email"
    url = "mailto:tomas@slama.dev"
    icon = "fa-solid fa-at"

  [[params.contacts]]
    label = "RSS feed"
    url = "/feed.xml"
    icon = "fa-solid fa-rss"

# Main navigation menu
[[menus.main]]
  name = "Home"
  url = "/"
  weight = 100
  [menus.main.params]
    icon = "fa-house"

[[menus.main]]
  name = "Reading"
  pageRef = "/reading"
  weight = 200
  [menus.main.params]
    icon = "fa-book"

[[menus.main]]
  name = "CV"
  pageRef = "/cv"
  weight = 300
  [menus.main.params]
    icon = "fa-id-card"

[[menus.main]]
  name = "Climbing"
  pageRef = "/climbing"
  weight = 400
  [menus.main.params]
    icon = "fa-bolt"

[[menus.main]]
  name = "Photos"
  pageRef = "/photos"
  weight = 500
  [menus.main.params]
    icon = "fa-camera"

[[menus.main]]
  name = "Videos"
  pageRef = "/videos"
  weight = 600
  [menus.main.params]
    icon = "fa-brands fa-youtube"

[[menus.main]]
  name = "Stickers"
  pageRef = "/stickers"
  weight = 700
  [menus.main.params]
    icon = "fa-note-sticky"

[[menus.main]]
  name = "Printomat"
  pageRef = "/printomat"
  weight = 800
  [menus.main.params]
    icon = "fa-print"

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineAnchors = ""
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
    style = "monokai"
    tabWidth = 4
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
      [markup.goldmark.extensions.extras.delete]
        enable = true
      [markup.goldmark.extensions.extras.subscript]
        enable = true
      [markup.goldmark.extensions.extras.superscript]
        enable = true
  [markup.tableOfContents]
    endLevel = 6
    ordered = false
    startLevel = 2

[permalinks]
  posts = "/:slug/"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

# Use Dart Sass for @use syntax support
[build]
  [build.buildStats]
    enable = false

[module]
  [module.hugoVersion]
    extended = true
  [[module.mounts]]
    source = "static"
    target = "static"
    files = ["! climbing/videos/unblurred/**", "! drone/videos/sources/**"]
  # The sticker drawing is a build input, not content: scripts/stickers.py turns
  # it into assets/stickers/stickers.html, which is what the page inlines. Left
  # mounted, Hugo publishes a 3 MB copy nobody fetches, and every Inkscape save
  # costs a full site rebuild -- which is how we kept hitting a rebuild panic.
  [[module.mounts]]
    source = "content"
    target = "content"
    files = ["! stickers/stickers.svg"]

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  page = ["HTML"]

[outputFormats.RSS]
  baseName = "feed"
